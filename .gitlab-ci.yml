stages:
  - structure
  - engine
  - test
  - client
  - release

# use official computer graphics image (based on ubuntu 24.04)
image: gitlab-edu.supsi.ch:5050/dti-isin/labingsw/common:ubuntu2404-cg

structure:
  # verify project structure
  stage: structure
  script:
    - '[ -d engine ] || exit 1'
    - '[ -d client ] || exit 1'
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "linux-temp"

engine:
  # compile, link and test engine
  stage: engine
  before_script:
    - 'cd engine'
  script:
    - 'make clean'      # Clean the build environment
    - 'make all'        # Compile all engine components (.o) and link libengine.so
  after_script:
    - 'cd ..'
  artifacts:
    name: "engine-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - engine/bin/Release/libengine.so
      - engine/bin/Debug/libengine.so
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "linux-temp"

test:
  # run engine tests (if available)
  stage: test
  dependencies:
    - engine
  before_script:
    - 'cd engine'
  script:
    - 'echo "Running tests..."'
    # Add test execution here when tests are implemented
    # Example: ./bin/Debug/engine-tests-runner
    - 'echo "No tests implemented yet"'
  after_script:
    - 'cd ..'
  artifacts:
    name: "test-results-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - engine/test-results/
    reports:
      junit: engine/test-results/*.xml
    when: always
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "linux-temp"
  allow_failure: true

client:
  # compile and link client
  stage: client
  dependencies:
    - engine
  script:
    - 'make build_client'     # Compile all client components (.o) and link client
  artifacts:
    name: "client-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - client/bin/Release/client
      - client/bin/Debug/client
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "linux-temp"

release:
  # create complete release package
  stage: release
  dependencies:
    - engine
    - client
  script:
    - 'echo "Creating release package..."'
    - 'mkdir -p release'
    - 'mkdir -p release/bin'
    - 'mkdir -p release/lib'
    - 'mkdir -p release/dependencies'
    # Copy binaries
    - 'cp client/bin/Release/client release/bin/'
    - 'cp engine/bin/Release/libengine.so release/lib/'
    # Copy dependencies
    - 'cp -r dependencies/freeimage/lib/x64/Release/* release/dependencies/ || true'
    - 'cp -r dependencies/freeglut/lib/x64/Release/* release/dependencies/ || true'
    # Copy documentation and scripts
    - 'cp README.txt release/'
    - 'cp run.sh release/ || true'
    # Create run script for the release
    - |
      cat > release/run.sh << 'EOF'
      #!/bin/bash
      cd "$(dirname "$0")"
      LD_LIBRARY_PATH=./lib:./dependencies:$LD_LIBRARY_PATH ./bin/client
      EOF
    - 'chmod +x release/run.sh'
    # Create archive
    - 'tar -czf release-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA.tar.gz release/'
  artifacts:
    name: "release-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - release/
      - release-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA.tar.gz
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "linux-temp"
